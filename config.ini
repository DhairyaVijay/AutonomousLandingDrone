# Configuration file for Landing Vision System
# Adjust these parameters based on your specific environment and drone

[camera]
# Camera settings
device_id = 0
width = 640
height = 480
fps = 30

# Use Raspberry Pi Camera Module instead of USB camera
use_picamera = false

[classification]
# Terrain classification parameters
use_tflite = false  # Set to true to use ML model instead of OpenCV

# HSV color thresholds for grass (adjust based on grass type)
grass_hue_min = 35      # Lower green hue
grass_hue_max = 85      # Upper green hue
grass_sat_min = 40      # Minimum saturation
grass_val_min = 40      # Minimum brightness

# HSV color thresholds for water
water_hue_min = 90      # Lower blue hue
water_hue_max = 130     # Upper blue hue
water_sat_min = 30      # Minimum saturation

# Concrete detection thresholds (gray/achromatic surfaces)
concrete_sat_max = 50   # Maximum saturation (low = gray)
concrete_val_min = 60   # Minimum brightness (not too dark)
concrete_val_max = 220  # Maximum brightness (not too bright)

# Classification thresholds
min_grass_coverage = 0.25    # Minimum % of frame to classify as grass
min_water_coverage = 0.15    # Minimum % of frame to classify as water
min_concrete_coverage = 0.30 # Minimum % of frame to classify as concrete
min_texture_variance = 100   # Minimum texture variance for grass
max_concrete_texture = 80    # Maximum texture variance for concrete
min_concrete_uniformity = 0.7 # Minimum color uniformity for concrete

[roughness]
# Roughness analysis parameters
grid_size = 32          # Size of analysis grid (32x32 recommended)
smoothing_kernel = 5    # Gaussian smoothing kernel size

# Scoring weights (must sum to 1.0)
texture_weight = 0.30   # Texture uniformity weight
edge_weight = 0.35      # Edge density weight
color_weight = 0.20     # Color uniformity weight
shadow_weight = 0.15    # Shadow detection weight

# Safety thresholds
min_safety_score = 0.5      # Minimum safety score to approve landing
dark_pixel_threshold = 50   # Threshold for detecting shadows (0-255)

[heatmap]
# Heatmap generation parameters
smoothing_kernel = 5        # Gaussian smoothing kernel
prefer_center = true        # Prefer landing zones near frame center
min_clearance_radius = 20   # Minimum clearance radius (pixels)

[mavlink]
# MAVLink communication settings
enable = false                      # Enable MAVLink communication
connection = /dev/ttyAMA0          # Serial port (Pi UART)
baudrate = 57600                   # Standard baudrate for most FCs
timeout = 10                       # Connection timeout (seconds)

# Camera FOV (Field of View) - adjust for your camera
horizontal_fov = 62.2   # degrees (Pi Camera V2)
vertical_fov = 48.8     # degrees (Pi Camera V2)

# Landing target update rate
update_rate = 10        # Hz (updates per second)
min_altitude = 0.5      # Minimum altitude to send landing targets (meters)

[performance]
# Performance optimization
target_fps = 15             # Target processing rate
enable_threading = false    # Use threading for camera capture (experimental)
log_level = INFO           # Logging level (DEBUG, INFO, WARNING, ERROR)

[visualization]
# Visualization options
enable = true               # Enable visualization windows
show_heatmap = true        # Show heatmap overlay
show_metrics = true        # Show performance metrics
save_frames = false        # Save frames to disk (for debugging)
output_dir = ./output      # Directory for saved frames
